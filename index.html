<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vượt Nhanh — Sàn nhiệm vụ kiếm tiền</title>
    <meta name="description" content="Nhận nhiệm vụ vượt liên kết và nhiệm vụ đa dạng, nộp thành quả, được duyệt và nhận thưởng VND trực tiếp vào ví." />
    <meta name="theme-color" content="#07080f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vượt Nhanh — Nền tảng nhiệm vụ kiếm thu nhập" />
    <meta
      property="og:description"
      content="Nhận nhiệm vụ hằng ngày, nộp thành quả và nhận thưởng VND tức thì. Không cần vốn, không cần kinh nghiệm."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Gắn theme TRƯỚC khi React render → không nháy trắng khi load
      ;(function () {
        try {
          var saved = localStorage.getItem('vn-theme')
          var t =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
