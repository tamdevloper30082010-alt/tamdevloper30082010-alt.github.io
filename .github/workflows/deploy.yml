# Deploy lên GitHub Pages.
# Cấu hình nằm trong repository variables (Settings → Secrets and variables →
# Actions), KHÔNG nằm trong code.
#
# Đây là *variables* chứ không phải *secrets* là có chủ đích: publishable key
# vốn đã công khai theo thiết kế — nó nằm sẵn trong bundle gửi tới trình
# duyệt. Secret key (sb_secret_… / service_role) thì TUYỆT ĐỐI không bao giờ
# đặt ở đây: mọi thao tác đặc quyền đã nằm trong RLS + SECURITY DEFINER của
# database nên frontend không cần tới nó.
name: Deploy lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài đặt
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
